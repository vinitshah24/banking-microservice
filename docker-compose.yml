services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
      POSTGRES_DB: banking
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking"]
      interval: 5s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: banking
      RABBITMQ_DEFAULT_PASS: banking
    ports: ["15672:15672"]
  redis:
    image: redis:7-alpine
  auth:
    build: {context: ., dockerfile: services/auth-service/Dockerfile}
    environment: &appenv
      DJANGO_SECRET_KEY: change-me
      JWT_SIGNING_KEY: change-me-in-development
      SERVICE_JWT_SECRET: change-me-in-development
      DATABASE_URL: postgresql://banking:banking@postgres:5432/banking
      RABBITMQ_URL: amqp://banking:banking@rabbitmq:5672//
    ports: ["8001:8000"]
    depends_on: {postgres: {condition: service_healthy}}
  customer:
    build: {context: ., dockerfile: services/customer-service/Dockerfile}
    environment: *appenv
    ports: ["8002:8000"]
    depends_on: {postgres: {condition: service_healthy}}
  account:
    build: {context: ., dockerfile: services/account-service/Dockerfile}
    environment: *appenv
    ports: ["8003:8000"]
    depends_on: {postgres: {condition: service_healthy}}
  ledger:
    build: {context: ., dockerfile: services/ledger-service/Dockerfile}
    environment: *appenv
    ports: ["8004:8000"]
    depends_on: {postgres: {condition: service_healthy}}
  payment:
    build: {context: ., dockerfile: services/payment-service/Dockerfile}
    environment: *appenv
    ports: ["8005:8000"]
    depends_on: {postgres: {condition: service_healthy}}
  notification:
    build: {context: ., dockerfile: services/notification-service/Dockerfile}
    environment: *appenv
    ports: ["8006:8000"]
    depends_on: {postgres: {condition: service_healthy}}
  audit:
    build: {context: ., dockerfile: services/audit-service/Dockerfile}
    environment: *appenv
    ports: ["8007:8000"]
    depends_on: {postgres: {condition: service_healthy}}
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8000:80"]
    depends_on: [auth, customer, account, ledger, payment, notification, audit]
volumes:
  postgres_data:
